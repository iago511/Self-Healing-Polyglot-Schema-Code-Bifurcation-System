name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Testes e imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Verificar dependencias
        run: python -m pip check

      - name: Executar testes
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Salvar relatorio dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: warn

      - name: Construir imagem Docker
        run: docker build -t sh-pscbs:test .

      - name: Verificar dependencias da imagem
        run: docker run --rm sh-pscbs:test python -m pip check

      - name: Verificar sintaxe na imagem
        run: docker run --rm sh-pscbs:test python -c "import ast, pathlib; arquivos = list(pathlib.Path('/app').glob('*.py')); [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for p in arquivos]; print(f'{len(arquivos)} arquivos Python validados')"
